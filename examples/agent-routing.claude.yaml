# Routes and arguments belong to this workspace, not any child repository.
# These defaults reduce interactive approval; change args here or in the
# generated agent-routing.yaml if the workspace requires stricter permissions.
# Tên route theo loại công việc; model cố định claude-sonnet-5-5, chỉ đổi --effort.
routes:
  # Tra cứu đơn giản, sửa nhỏ, cập nhật tài liệu
  claude-lookup:
    agent: claude
    args: ["--permission-mode", "auto", "--model", "claude-sonnet-5-5", "--effort", "low"]
  # Implementation và testing thông thường
  claude-coding:
    agent: claude
    args: ["--permission-mode", "auto", "--model", "claude-sonnet-5-5", "--effort", "medium"]
  # Discovery, phân tích luồng, review
  claude-analysis:
    agent: claude
    args: ["--permission-mode", "auto", "--model", "claude-sonnet-5-5", "--effort", "high"]
  # HẠN CHẾ DÙNG (tốn token, chậm): chỉ khi claude-analysis đã thử mà chưa đủ.
  # Bug khó, thay đổi liên module, refactor
  claude-deep:
    agent: claude
    args: ["--permission-mode", "auto", "--model", "claude-sonnet-5-5", "--effort", "xhigh"]
  # HẠN CHẾ DÙNG (tốn token nhất, chậm nhất): chỉ cho task rủi ro cao.
  # Task rủi ro cao
  claude-critical:
    agent: claude
    args: ["--permission-mode", "auto", "--model", "claude-sonnet-5-5", "--effort", "max"]
