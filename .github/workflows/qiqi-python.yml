name: Standalone QiQi Python
on:
  push:
    paths:
      - "qiqi_delegate/**"
      - "tests-standalone/**"
      - "pyproject.toml"
      - ".github/workflows/qiqi-python.yml"
  pull_request:
    paths:
      - "qiqi_delegate/**"
      - "tests-standalone/**"
      - "pyproject.toml"
      - ".github/workflows/qiqi-python.yml"
jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install standalone package
        run: python -m pip install -e '.[test]'
      - name: Compile source
        run: python -m compileall -q qiqi_delegate
      - name: Run tests
        run: python -m pytest -q tests-standalone
